[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trial-criterion-screening"
version = "0.1.0"
description = "Reproducible educational clinical trial criterion screening research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "scikit-learn>=1.3"]

[project.optional-dependencies]
data = ["datasets>=2.18", "pandas>=2.0"]
model = ["transformers>=4.46", "peft>=0.13", "accelerate>=1.0", "safetensors>=0.4"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["trial_screening*"]

